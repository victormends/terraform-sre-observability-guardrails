apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: checkout-api-spot-ha
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Replace with your repository URL before applying in ArgoCD.
    repoURL: https://github.com/example-org/terraform-sre-observability-guardrails.git
    targetRevision: main
    path: k8s/spot-ha-overlay/overlays/prod-spot-ha
  destination:
    server: https://kubernetes.default.svc
    namespace: synthetic-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
